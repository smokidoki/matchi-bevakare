name: Bevaka MATCHi

on:
  # Schemat är avstängt: MATCHi blockerar GitHubs servrar (403). Kör boten hemifrån istället (se README).
  # schedule:
  #   - cron: "*/10 4-21 * * *"
  workflow_dispatch: {}

concurrency:
  group: bevaka
  cancel-in-progress: false

jobs:
  bevaka:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Kom ihåg vilka tider vi redan notifierat om mellan körningarna
      - name: Hämta tidigare state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Kolla lediga tider
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python matchi_bevakare.py

      - name: Spara state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
